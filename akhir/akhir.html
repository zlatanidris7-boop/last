<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrO.Room.id — Let's create your dream room</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Courier+Prime&family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="akhir.css">
</head>
<body>
 
  <main class="frame">
 
    <!-- Bar atas -->
    <header class="topbar">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span class="signature">guest</span>
    </header>
 
    <!-- Judul -->
    <p class="title">let's create your dream room</p>
 
    <!-- Tiga potongan foto kamar -->
    <div class="strip strip-1" role="img" aria-label="Kamar tidur bagian kiri"></div>
    <div class="strip strip-2" role="img" aria-label="Kamar tidur bagian tengah"></div>
    <div class="strip strip-3" role="img" aria-label="Kamar tidur bagian kanan"></div>
 
    <p class="tagline">every dream can come true</p>
    <p class="caption">Sofa</p>
 
    <!-- Dua foto kecil -->
    <img class="item item-pouf" src="img/pouf.jpg" alt="Pouf hitam bulat di lantai kayu">
    <img class="item item-sofa" src="img/sofa.jpg" alt="Ruang tamu dengan sofa">
 
    <!-- Kontak -->
    <footer class="contact">
      <p class="contact-title">contact us</p>
 
      <a class="ig" href="https://www.instagram.com/pro.room.id/" target="_blank" rel="noopener" aria-label="Instagram PrO.Room.id">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ig-grad" cx="30%" cy="107%" r="150%">
              <stop offset="0" stop-color="#fdf497"/>
              <stop offset="0.05" stop-color="#fdf497"/>
              <stop offset="0.45" stop-color="#fd5949"/>
              <stop offset="0.6" stop-color="#d6249f"/>
              <stop offset="0.9" stop-color="#285aeb"/>
            </radialGradient>
          </defs>
          <rect width="48" height="48" rx="11" fill="url(#ig-grad)"/>
          <rect x="11" y="11" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3"/>
          <circle cx="24" cy="24" r="6.5" fill="none" stroke="#fff" stroke-width="3"/>
          <circle cx="31.5" cy="16.5" r="1.8" fill="#fff"/>
        </svg>
      </a>
 
      <p class="handle">@PrO.Room.id</p>
    </footer>
 
  </main>
 
</body>
</html>
